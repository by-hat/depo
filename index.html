<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Kaydetme</title>
</head>
<body>

    <h1>IP Kaydetme Testi</h1>

    <script>
        // ipify API kullanarak IP adresini alıyoruz
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const userIP = data.ip;
                // IP'yi PHP'ye gönderiyoruz
                sendIPToServer(userIP);
            })
            .catch(error => console.error('IP alırken hata:', error));

        // IP'yi PHP'ye AJAX ile gönderiyoruz
        function sendIPToServer(ip) {
            fetch('save_ip.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'ip=' + ip
            })
            .then(response => response.text())
            .then(data => console.log('IP sunucuya kaydedildi:', data))
            .catch(error => console.error('IP gönderilirken hata:', error));
        }
    </script>

</body>
</html>
